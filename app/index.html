<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1d3a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icono-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Azul" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Azul</title>
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div class="brand">
          <span class="orb" aria-hidden="true"></span>
          <h1>Azul</h1>
        </div>
        <div class="controles">
          <button
            type="button"
            id="oye-azul"
            class="oye-azul"
            aria-pressed="false"
            title="Escuchar &quot;Oye Azul&quot; con la app abierta"
          >
            Oye Azul
          </button>
          <p id="estado" class="estado" role="status">Conectando…</p>
        </div>
      </header>

      <main id="conversacion" class="conversacion" aria-live="polite" aria-label="Conversación">
      </main>

      <form id="formulario" class="entrada">
        <button
          type="button"
          id="microfono"
          class="microfono"
          data-estado="inactivo"
          aria-label="Toca para hablarle a Azul"
          title="Toca para hablarle a Azul"
        >
          <svg class="icono-microfono" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z" />
          </svg>
          <svg class="icono-detener" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" rx="2" />
          </svg>
        </button>
        <label for="texto" class="solo-lector">Escríbele a Azul</label>
        <textarea id="texto" rows="1" placeholder="Escríbele o toca 🎤 para hablar" autocomplete="off"></textarea>
        <button type="submit" id="enviar">Enviar</button>
        <button type="button" id="parar" class="parar" hidden>Parar</button>
      </form>
    </div>
    <dialog id="entrada" class="entrada-clave" aria-labelledby="entrada-titulo">
      <form id="formulario-clave" method="dialog">
        <span class="orb" aria-hidden="true"></span>
        <h2 id="entrada-titulo">Entrar a Azul</h2>
        <p>Escribe la clave de acceso. Solo te la pediré una vez en este dispositivo.</p>
        <label for="clave" class="solo-lector">Clave de acceso</label>
        <input id="clave" type="password" autocomplete="current-password" required />
        <p id="error-clave" class="error-clave" role="alert"></p>
        <button type="submit">Entrar</button>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
