<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1d3a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icono.svg" type="image/svg+xml" />
    <title>Azul</title>
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div class="brand">
          <span class="orb" aria-hidden="true"></span>
          <h1>Azul</h1>
        </div>
        <p id="estado" class="estado" role="status">Conectando…</p>
      </header>

      <main id="conversacion" class="conversacion" aria-live="polite" aria-label="Conversación">
      </main>

      <form id="formulario" class="entrada">
        <label for="texto" class="solo-lector">Escríbele a Azul</label>
        <textarea id="texto" rows="1" placeholder="Escríbele a Azul…" autocomplete="off"></textarea>
        <button type="submit" id="enviar">Enviar</button>
        <button type="button" id="parar" class="parar" hidden>Parar</button>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
