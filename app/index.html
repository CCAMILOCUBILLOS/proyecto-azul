<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1d3a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icono.svg" type="image/svg+xml" />
    <title>Azul</title>
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div class="brand">
          <span class="orb" aria-hidden="true"></span>
          <h1>Azul</h1>
        </div>
        <p id="estado" class="estado" role="status">Conectando…</p>
      </header>

      <main id="conversacion" class="conversacion" aria-live="polite" aria-label="Conversación">
      </main>

      <form id="formulario" class="entrada">
        <button
          type="button"
          id="microfono"
          class="microfono"
          aria-label="Mantén presionado para hablar"
          title="Mantén presionado para hablar"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z" />
          </svg>
        </button>
        <label for="texto" class="solo-lector">Escríbele a Azul</label>
        <textarea id="texto" rows="1" placeholder="Escríbele o mantén 🎤" autocomplete="off"></textarea>
        <button type="submit" id="enviar">Enviar</button>
        <button type="button" id="parar" class="parar" hidden>Parar</button>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
