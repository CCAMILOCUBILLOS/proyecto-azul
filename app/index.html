<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icono-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Azul" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Azul</title>
  </head>
  <body>
    <canvas id="orbe" class="orbe" aria-hidden="true"></canvas>
    <div class="shell">
      <header class="top">
        <h1 class="solo-lector">Azul</h1>
        <div class="controles">
          <button
            type="button"
            id="oye-azul"
            class="oye-azul"
            aria-pressed="false"
            title="Escuchar &quot;Oye Azul&quot; con la app abierta"
          >
            Oye Azul
          </button>
          <p id="estado" class="estado" role="status">Conectando…</p>
        </div>
      </header>

      <section id="escena" class="escena" aria-label="Azul">
        <div id="subtitulos" class="subtitulos" data-frases="false">
          <p id="estado-voz" class="estado-voz" aria-live="polite"></p>
          <div class="frases">
            <p id="subtitulo-usuario" class="subtitulo-usuario"></p>
            <p id="subtitulo-azul" class="subtitulo-azul"></p>
          </div>
        </div>
      </section>

      <form id="formulario" class="entrada" hidden>
        <label for="texto" class="solo-lector">Escríbele a Azul</label>
        <textarea id="texto" rows="1" placeholder="Escríbele a Azul" autocomplete="off"></textarea>
        <button type="submit" id="enviar" class="enviar">Enviar</button>
        <button type="button" id="parar" class="parar" hidden>Parar</button>
      </form>

      <nav class="pie" aria-label="Controles">
        <button
          type="button"
          id="teclado"
          class="boton-redondo"
          aria-expanded="false"
          aria-controls="formulario"
          aria-label="Escribir"
          title="Escribir"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="6" width="18" height="12" rx="2.5" />
            <path d="M7 10h.01M10.5 10h.01M14 10h.01M17 10h.01M8 14h8" />
          </svg>
        </button>
        <button
          type="button"
          id="microfono"
          class="microfono"
          data-estado="inactivo"
          aria-label="Toca para hablarle a Azul"
          title="Toca para hablarle a Azul"
        >
          <svg class="icono-microfono" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3" />
            <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" />
          </svg>
          <svg class="icono-detener" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="7" y="7" width="10" height="10" rx="2" />
          </svg>
        </button>
        <button
          type="button"
          id="abrir-historial"
          class="boton-redondo"
          aria-expanded="false"
          aria-controls="historial"
          aria-label="Ver la conversación"
          title="Ver la conversación"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 6.5h14M5 12h14M5 17.5h9" />
          </svg>
        </button>
      </nav>
    </div>

    <aside id="historial" class="historial" aria-labelledby="historial-titulo" hidden>
      <header class="historial-encabezado">
        <div>
          <h2 id="historial-titulo">Conversación</h2>
          <p id="gasto" class="gasto"></p>
          <p id="saber" class="gasto"></p>
        </div>
        <button type="button" id="cerrar-historial" class="boton-redondo" aria-label="Cerrar" title="Cerrar">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" />
          </svg>
        </button>
      </header>
      <div id="conversacion" class="conversacion" aria-live="polite" aria-label="Mensajes"></div>
    </aside>

    <dialog id="entrada" class="entrada-clave" aria-labelledby="entrada-titulo">
      <form id="formulario-clave" method="dialog">
        <span class="orb" aria-hidden="true"></span>
        <h2 id="entrada-titulo">Entrar a Azul</h2>
        <p>Escribe la clave de acceso. Solo te la pediré una vez en este dispositivo.</p>
        <label for="clave" class="solo-lector">Clave de acceso</label>
        <input id="clave" type="password" autocomplete="current-password" required />
        <p id="error-clave" class="error-clave" role="alert"></p>
        <button type="submit">Entrar</button>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
