[project]
name = "azul"
version = "0.9.0"
description = "Núcleo de Azul, asistente personal por voz"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.2",
    "httpx2>=2.13.1",
    "miniaudio>=1.71",
    "pynput>=1.8.2",
    "python-docx>=1.2.0",
    "pypdf>=6.19.0",
    "openpyxl>=3.1.5",
    "vosk>=0.3.45",
]

[project.scripts]
azul = "azul.main:run"
azul-respaldar = "azul.cli:respaldar"
azul-restaurar = "azul.cli:restaurar"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
